summary: "MS CS new grad (Northeastern, 04/2026) with 7 months at ByteDance/TikTok building production AI agents. Shipped a Go on-call diagnostic bot serving 200+ users that automates 50% of ad-platform incidents via RAG + multi-agent workflows. Strong in Go, TypeScript, React, Python."

bullets:
  "Bytedance":
    - "Shipped production **AI agent** in **Go** serving **200+ internal users**, reducing average incident resolution time **50%** (7→3.5 days) by auto-aggregating ads data and relevant past incidents at ticket creation"
    - "Designed **multi-agent diagnostic workflows** from internal runbooks for ad-delivery debugging, reducing manual escalations that previously required **10+ people** per incident"
    - "Enabled **knowledge-base-driven self-service** powered by **RAG** and **LLM-based routing** that automates **50% of 30+ weekly ad-platform issues**, eliminating dependency on on-call engineers for common incidents"
    - "Built **knowledge pipeline** converting resolved incidents into searchable articles via **LLM** summarization and **RAG**, with **Redis** caching on high-frequency lookups to minimize query latency"
    - "Owned **end-to-end delivery** of 6+ integrated diagnostic tools (permission verification, access checks, log lookup, one-click bug filing) behind a unified card interface accessible to non-technical staff"

  "ReMo":
    - "Built **Go + FastAPI** backend services achieving **sub-3s inference latency** for multi-stage OCR and LLM-based metadata extraction"
    - "Engineered a **90% accurate** book-spine recognition pipeline with **YOLOv11**, Internvl, and custom **LLM**-based metadata extraction"
    - "Optimized **React** frontend with lazy-loading and code-splitting, reducing initial page load time by **25%**"
    - "Containerized and deployed services via **Docker**, **AWS ECS**, and API Gateway for high availability"

  "Yanray":
    - "Delivered **95% structured field extraction accuracy** by building a business-card recognition pipeline with **Azure AI Vision** and a custom **LLM**"
    - "Boosted metadata retrieval speed **31%** (175ms→120ms) by caching reference lookups in **Redis** and optimizing Cosmos DB queries"
    - "Applied SDLC best practices to develop, test, and deploy the backend on **Azure App Service**, integrating telemetry with Application Insights"

  "Acer":
    - "Built a real-time meeting assistant performing face and QR recognition under **300ms latency** by combining model training, **OpenVINO** quantization, and async inference"
    - "Trained and fine-tuned **YOLOv7** and **FaceNet** for QR detection and face recognition, optimizing accuracy and deployment efficiency"
    - "Reduced model latency **50%** through **INT8 quantization** and CPU-targeted model conversion"

